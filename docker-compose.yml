services:
  localstack:
    image: localstack/localstack:3.8
    container_name: order-events-localstack
    ports:
      - "4566:4566"
    environment:
      # kms is on the list even though the code has no KMS resource: the table asks
      # for encryption at rest and DynamoDB handles that by requesting a key from KMS.
      # Without the service running, CreateTable creates the table and then returns 500,
      # the provider retries and the second attempt fails with ResourceInUseException.
      SERVICES: events,sqs,lambda,dynamodb,sns,iam,logs,cloudwatch,sts,kms
      # Default queue URLs use the localhost.localstack.cloud domain, which forces an
      # external DNS lookup on every operation. In an environment without internet
      # access that means a 25-second timeout per call.
      SQS_ENDPOINT_STRATEGY: "off"
      DEBUG: "0"
      # LocalStack does not run the function in its own process: each invocation starts
      # a container with the runtime image. This value is how long it is kept alive
      # afterwards, so the second invocation does not pay the startup cost again.
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "120"
    volumes:
      # Consequence of the above: it needs to talk to the host's Docker daemon to create
      # those containers. Without this mount, every invocation fails.
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf http://localhost:4566/_localstack/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
