line-length = 100
target-version = "py312"

[lint]
# E and F are the core of pyflakes and pycodestyle, I sorts imports, UP modernizes
# legacy syntax and B catches typical Python logic bugs. Nothing ignored.
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
# The handler is imported by its bare name because it sits at the zip root. Without this
# ruff treats it as a third-party dependency and groups it with boto3 and pytest.
known-first-party = ["handler"]
