line-length = 100
target-version = "py312"

[lint]
# E y F son el nucleo de pyflakes y pycodestyle, I ordena los imports, UP moderniza
# sintaxis heredada y B atrapa los errores logicos tipicos de Python. Nada ignorado.
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
# El handler se importa por nombre pelado porque en el zip queda en la raiz. Sin esto
# ruff lo toma por una dependencia externa y lo mezcla con boto3 y pytest.
known-first-party = ["handler"]
