name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"
  PYTHON_VERSION: "3.12"
  TFVARS: environments/local.tfvars

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform format
        run: terraform fmt -check -recursive

      - name: init without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: terraform
        run: terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: ruff
        run: |
          pip install ruff==0.7.2
          ruff check src/ tests/

      # The exact version is installed instead of using the official action, which resolves
      # the latest release: a new check published on a Tuesday breaks CI without anyone
      # touching the repository. Failing hard is the CLI's default behavior.
      - name: checkov
        run: |
          pip install checkov==3.2.334
          checkov --directory terraform --framework terraform --compact

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: test dependencies
        run: pip install -r tests/requirements.txt

      # Needs neither LocalStack nor Terraform, so it runs in parallel with lint and gives
      # the first signal that something broke in under a minute.
      - name: unit tests
        run: pytest tests/test_handler.py -v

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.8
        ports:
          - 4566:4566
        env:
          SERVICES: events,sqs,lambda,dynamodb,sns,iam,logs,cloudwatch,sts,kms
          SQS_ENDPOINT_STRATEGY: "off"
          DEBUG: "0"
          LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "120"
        volumes:
          # LocalStack runs each function invocation as a separate container,
          # so it needs the runner's Docker daemon.
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: test dependencies
        run: pip install -r tests/requirements.txt

      - name: init
        working-directory: terraform
        run: terraform init -input=false

      - name: apply
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var-file=${{ env.TFVARS }}

      - name: integration tests
        run: pytest tests/test_integration.py -v

      # Always, even if the tests fail: leaves the environment as it found it and checks
      # along the way that destroy works.
      - name: destroy
        if: always()
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false -var-file=${{ env.TFVARS }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the full history, not the working tree: a credential deleted
          # in a later commit is still in the repository.
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --verbose

      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
